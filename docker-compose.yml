services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_catalogo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/saas_catalogo?schema=public
      JWT_SECRET: change-me-to-a-strong-secret-min-32-chars
      JWT_EXPIRES_IN: 7d
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

volumes:
  postgres_data:

